# cargo-audit configuration. cargo-audit reads it from the current directory
# only, so run scripts/audit.sh from anywhere: it audits every Cargo.lock in the
# repo (the runtime and each connector) from the root, against this one list.

[advisories]
ignore = [
    # idna 0.1.5 accepts Punycode labels that decode to plain ASCII. It comes
    # through url 1.7 <- amq-protocol 1.4 <- amiquip 0.4.2 (the last amiquip
    # release), in connectors/amqp only, where it parses the broker URL the
    # operator configures, never untrusted input. Leaves with amiquip.
    "RUSTSEC-2024-0421",
    
    # url 1.7.2 has stack overflow in Url::origin() on nested blob: URLs.
    # Locked by amq-protocol 1.4 <- amiquip 0.4.2 (unmaintained since 2020).
    # Only used in connectors/amqp to parse operator-configured broker URLs,
    # never untrusted input. Leaves with amiquip replacement.
    "RUSTSEC-2026-0592",
    
    # proc-macro-error2 2.0.1 is unmaintained. Used by mysql_async through
    # mysql_common. The crate is a proc-macro helper with no runtime security
    # impact. Leaves when mysql_async updates its dependencies.
    "RUSTSEC-2026-0173",
    
    # lru 0.12.5 has potential use-after-free in LruCache::pop() and violates
    # Stacked Borrows in IterMut. Used by mysql_async for connection pooling.
    # The connector uses mysql_async's connection pool in a single-threaded
    # context with no panic-unsafe operations. Leaves when mysql_async updates.
    "RUSTSEC-2026-0253",
    "RUSTSEC-2026-0002",
]
