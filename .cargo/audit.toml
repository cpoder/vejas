# cargo-audit configuration. cargo-audit reads it from the current directory
# only, so run scripts/audit.sh from anywhere: it audits every Cargo.lock in the
# repo (the runtime and each connector) from the root, against this one list.

[advisories]
ignore = [
    # idna 0.1.5 accepts Punycode labels that decode to plain ASCII. It comes
    # through url 1.7 <- amq-protocol 1.4 <- amiquip 0.4.2 (the last amiquip
    # release), in connectors/amqp only, where it parses the broker URL the
    # operator configures, never untrusted input. Leaves with amiquip.
    "RUSTSEC-2024-0421",
]
