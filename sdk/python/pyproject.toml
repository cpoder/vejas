[project]
name = "vejas"
version = "0.1.0"
description = "Vejas flow SDK: plain-code integration flows on NATS JetStream."
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = ["nats-py>=2.6"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["vejas"]
