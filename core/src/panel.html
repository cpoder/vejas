<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vejas</title>
<style>
  :root {
    color-scheme: light dark;
    --ground: #f6f5f1; --surface: #ffffff; --sunk: #efede7;
    --ink: #1b1d1c; --ink2: #464c4a; --ink3: #5d6361;
    --line: #e3e1da; --line2: #cfccc2;
    --rail: #10292d; --rail-ink: #e8efee; --rail-ink2: #a9bdbb; --rail-hi: #1d4248;
    --in: #0b6e7f; --in-wash: #e3f1f2; --on-in: #ffffff;
    --out: #9a4d00; --out-wash: #fbeedd;
    --edit: #fffbea; --edit-hi: #fff2c2; --edit-line: #c9a227; --edit-ink: #5f4b00;
    --ok: #2b7a3b; --ok-wash: #e6f3e8; --err: #b42318; --err-wash: #fdecea;
    --warn: #f0b429; --warn-ink: #2b1d00;
    --shadow: 0 1px 2px rgba(16, 41, 45, .06), 0 4px 14px rgba(16, 41, 45, .05);
    --mono: ui-monospace, "SF Mono", "Cascadia Mono", Menlo, Consolas, monospace;
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --ground: #131716; --surface: #1b201f; --sunk: #232a28;
      --ink: #edf1f0; --ink2: #bfc8c6; --ink3: #a0aaa8;
      --line: #2c3332; --line2: #3d4644;
      --rail: #0b1c1f; --rail-ink: #e3ecea; --rail-ink2: #9fb3b1; --rail-hi: #17343a;
      --in: #6cc9d4; --in-wash: #133238; --on-in: #0b1c1f;
      --out: #f2a65e; --out-wash: #3a2a17;
      --edit: #2e2912; --edit-hi: #3a3317; --edit-line: #b8932a; --edit-ink: #f1d98a;
      --ok: #72d088; --ok-wash: #173223; --err: #ff8f80; --err-wash: #3b1f1b;
      --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 4px 14px rgba(0, 0, 0, .25);
    }
  }
  * { box-sizing: border-box; }
  html { scrollbar-color: var(--line2) transparent; }
  body { margin: 0; font: 15px/1.5 var(--sans); color: var(--ink);
         background: linear-gradient(90deg, var(--rail) 0 248px, var(--ground) 248px);
         display: grid; grid-template-columns: 248px minmax(0, 1fr); min-height: 100vh; }
  ::selection { background: var(--in-wash); color: var(--ink); }
  :focus-visible { outline: 2px solid var(--in); outline-offset: 2px; }
  ::placeholder { color: var(--ink3); opacity: 1; }
  input, textarea { caret-color: var(--in); }
  a { color: var(--in); text-underline-offset: 3px; }
  code { font: 13.5px var(--mono); }
  button, input, select, textarea { font: inherit; color: inherit; }
  svg.i { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.75;
          stroke-linecap: round; stroke-linejoin: round; flex: none; vertical-align: -3px; }
  .sprite { position: absolute; width: 0; height: 0; overflow: hidden; }
  .num { font-variant-numeric: tabular-nums; }
  .muted { color: var(--ink3); }
  .bad { color: var(--err); }
  .ok-i { color: var(--ok); } .err-i { color: var(--err); }
  [hidden] { display: none !important; }

  /* ---------- the rail: where things are ---------- */
  .rail { background: var(--rail); color: var(--rail-ink); padding: 18px 12px 16px; display: flex;
          flex-direction: column; gap: 18px; position: sticky; top: 0; height: 100vh; overflow-y: auto;
          scrollbar-color: var(--rail-hi) transparent; }
  .brand { display: flex; align-items: center; gap: 10px; padding: 2px 8px; font-weight: 700; font-size: 18px;
           color: var(--rail-ink); text-decoration: none; }
  .brand svg path { stroke: #5fc4cf; stroke-width: 2.6; fill: none; stroke-linecap: round; }
  .rail h2 { margin: 0 0 4px; padding: 0 8px; font-size: 12.5px; font-weight: 600; color: var(--rail-ink2); }
  .rail .item { display: flex; align-items: center; gap: 9px; padding: 7px 8px; border-radius: 8px;
                color: var(--rail-ink); text-decoration: none; font-size: 14.5px; min-width: 0; }
  .rail .item .t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .rail .item:hover { background: var(--rail-hi); }
  .rail .item[aria-current="page"] { background: var(--rail-ink); color: var(--rail); font-weight: 600; }
  .rail .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; background: #4cc38a; margin: 0 4px; }
  .rail .dot.off { background: #7f9593; } .rail .dot.bad { background: #ff8f80; }
  .rail .meta { margin-left: auto; font-size: 12.5px; color: var(--rail-ink2); }
  .rail .item[aria-current="page"] .meta { color: #48605e; }
  .rail .pill { margin-left: auto; font-size: 12.5px; font-weight: 700; background: var(--warn); color: var(--warn-ink);
                border-radius: 999px; padding: 0 8px; }
  .rail .add { color: var(--rail-ink2); }
  .rail .none { margin: 2px 8px; font-size: 13.5px; color: var(--rail-ink2); }
  .rail .pkg { margin: 8px 8px 2px 33px; font-size: 12.5px; color: var(--rail-ink2); }
  .rail .foot { margin-top: auto; padding: 0 8px; font-size: 12.5px; color: var(--rail-ink2);
                display: flex; align-items: center; gap: 2px; }

  /* ---------- a page ---------- */
  main { padding: 28px 44px 72px; min-width: 0; }
  .page { max-width: 1060px; }
  .head { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  h1 { margin: 0; font-size: 26px; line-height: 1.2; font-weight: 700; letter-spacing: -.01em; }
  .head .actions { margin-left: auto; display: flex; gap: 8px; }
  .lede { color: var(--ink2); margin: 6px 0 26px; max-width: 74ch; }
  .lede b { color: var(--ink); font-weight: 600; }
  .lede b.bad { color: var(--err); }
  .state { display: inline-flex; align-items: center; gap: 7px; font-size: 13.5px; font-weight: 600;
           border-radius: 999px; padding: 3px 11px; }
  .state.ok { color: var(--ok); background: var(--ok-wash); }
  .state.off { color: var(--ink2); background: var(--sunk); }
  .state.bad { color: var(--err); background: var(--err-wash); }
  .state .dot { width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
  .tag { font-size: 12.5px; font-weight: 600; color: var(--ink2); background: var(--sunk); border-radius: 6px;
         padding: 1px 8px; white-space: nowrap; }
  .callout { display: flex; gap: 10px; align-items: flex-start; border-radius: 10px; padding: 10px 14px;
             margin: -8px 0 22px; background: var(--err-wash); max-width: 900px; }
  .callout svg { color: var(--err); margin-top: 3px; }
  .callout p { margin: 0; }
  .empty { color: var(--ink2); background: var(--surface); border: 1px dashed var(--line2); border-radius: 12px;
           padding: 22px 24px; display: flex; gap: 14px; align-items: center; flex-wrap: wrap; }
  .empty p { margin: 0; }
  .empty b { color: var(--ink); }
  .empty > svg.i { width: 26px; height: 26px; color: var(--ink3); }

  .btn { font: 600 14px var(--sans); border-radius: 9px; padding: 7px 13px; border: 1px solid var(--line2);
         background: var(--surface); color: var(--ink); display: inline-flex; align-items: center; gap: 7px;
         cursor: pointer; text-decoration: none; white-space: nowrap; }
  .btn:hover { border-color: var(--ink3); }
  .btn.primary { background: var(--in); border-color: var(--in); color: var(--on-in); }
  .btn.primary:hover { filter: brightness(1.1); }
  .btn.quiet { background: transparent; border-color: transparent; color: var(--ink2); }
  .btn.quiet:hover { background: var(--sunk); color: var(--ink); }
  .btn:disabled { opacity: .55; cursor: default; filter: none; }
  .btn svg.i { width: 16px; height: 16px; vertical-align: 0; }
  .btn.small { font-size: 13.5px; padding: 4px 10px; border-radius: 8px; }

  .subject { font: 600 13px var(--mono); border-radius: 6px; padding: 1px 7px; background: var(--sunk);
             color: var(--ink); white-space: nowrap; }
  .subject.in { color: var(--in); background: var(--in-wash); }
  .subject.out { color: var(--out); background: var(--out-wash); }

  /* ---------- a flow, read top to bottom ---------- */
  .route { position: relative; padding-left: 50px; }
  .route::before { content: ""; position: absolute; left: 18px; top: 26px; bottom: 34px; width: 3px; border-radius: 2px;
                   background: linear-gradient(var(--in) 0 12%, var(--line2) 26% 74%, var(--out) 88%); }
  .stop { position: relative; margin-bottom: 16px; }
  .stop .mark { position: absolute; left: -50px; top: 12px; width: 39px; height: 39px; border-radius: 50%;
                display: grid; place-items: center; background: var(--surface); border: 3px solid var(--ink3);
                color: var(--ink2); }
  .stop.in .mark { border-color: var(--in); color: var(--in); }
  .stop.out .mark { border-color: var(--out); color: var(--out); }
  .box { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px 18px 16px;
         box-shadow: var(--shadow); }
  .stop.in .box { border-color: color-mix(in srgb, var(--in) 45%, var(--line)); }
  .stop.out .box { border-color: color-mix(in srgb, var(--out) 45%, var(--line)); }
  .box h2 { margin: 0; font-size: 18px; font-weight: 700; display: flex; align-items: baseline; gap: 6px 10px;
            flex-wrap: wrap; }
  .box h2 .what { font-weight: 400; color: var(--ink2); font-size: 15px; }
  .box .note { margin: 8px 0 0; color: var(--ink2); }
  .box .note a { font-weight: 600; }
  .box .more-line { margin-top: 12px; font-size: 14px; color: var(--ink2); display: flex; align-items: center;
                    gap: 10px; flex-wrap: wrap; }

  .fields { display: grid; grid-template-columns: minmax(140px, max-content) minmax(0, 1fr); column-gap: 22px;
            margin-top: 12px; }
  .fields > div { padding: 5px 0; border-bottom: 1px solid var(--line); min-width: 0; }
  .fields .k { font: 600 13.5px var(--mono); }
  .fields .v { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .names { margin-top: 10px; display: flex; gap: 6px 14px; flex-wrap: wrap; font: 600 13.5px var(--mono); }
  .sv { font: 600 13px var(--mono); background: var(--sunk); border-radius: 6px; padding: 2px 8px; color: var(--ink);
        display: inline-block; max-width: 300px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
        vertical-align: middle; }
  .none { font-style: italic; color: var(--ink3); font-size: 13.5px; }

  table.map { width: 100%; border-collapse: collapse; margin-top: 10px; }
  table.map th { text-align: left; font-size: 12.5px; font-weight: 600; color: var(--ink3); padding: 6px 14px 6px 0; white-space: nowrap;
                 border-bottom: 1px solid var(--line); }
  table.map td { padding: 9px 14px 9px 0; border-bottom: 1px solid var(--line); vertical-align: top; }
  table.map tr:last-child > td { border-bottom: 0; }
  td.name { font: 600 13.5px var(--mono); white-space: nowrap; width: 1%; padding-top: 11px; }
  td.eq { color: var(--ink3); width: 1%; font: 13.5px var(--mono); padding-top: 11px; }
  td.sample { width: 1%; white-space: nowrap; padding-top: 9px; }
  .how, td.how { font: 13.5px/1.75 var(--mono); color: var(--ink2); white-space: pre-wrap; word-break: break-word; }
  .how .ref { color: var(--in); }
  .how .str { color: var(--ink2); }
  .how .cmt { color: var(--ink3); font-style: italic; }
  tr.slot > td { padding-top: 0; }
  details.src { margin-top: 4px; font-family: var(--sans); }
  details.src > summary { cursor: pointer; font-size: 13.5px; font-weight: 600; color: var(--ink3); width: fit-content; }
  details.src pre { margin: 6px 0 0; font: 12.5px/1.6 var(--mono); background: var(--sunk); border-radius: 8px;
                    padding: 8px 12px; white-space: pre-wrap; }

  .call { display: flex; gap: 10px; align-items: flex-start; margin-top: 10px; }
  .call > svg.i { margin-top: 3px; color: var(--ink3); }
  .call a { font-weight: 600; }
  .rule { margin-top: 10px; line-height: 2; }
  .rule .kw { font-weight: 600; }
  .rule code.cond { font: 13.5px/2 var(--mono); }
  .rule.raw code { background: var(--sunk); padding: 1px 8px; border-radius: 6px; }
  .rule .hint { display: block; font-size: 13.5px; color: var(--ink3); line-height: 1.5; }
  .linkish { font: inherit; color: var(--in); background: none; border: 0; padding: 0; cursor: pointer;
             text-decoration: underline; text-underline-offset: 3px; }
  .rule.quiet { color: var(--ink2); }
  .send + .send { margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--line); }
  .send p { margin: 8px 0 0; }
  .reader { color: var(--ink2); font-size: 14px; }
  .reader svg.i { color: var(--ink3); margin-right: 6px; }
  details.more { margin-top: 10px; }
  details.more > summary { cursor: pointer; font-size: 14px; font-weight: 600; color: var(--ink2); width: fit-content; }
  details.more > summary:hover { color: var(--ink); }
  pre.json { margin: 8px 0 0; font: 12.5px/1.55 var(--mono); background: var(--sunk); border-radius: 8px;
             padding: 10px 12px; color: var(--ink2); overflow: auto; max-height: 360px; white-space: pre-wrap;
             word-break: break-word; }

  .legend { display: flex; gap: 8px 22px; flex-wrap: wrap; margin: 18px 0 0 50px; font-size: 13.5px; color: var(--ink2); }
  .legend span { display: inline-flex; align-items: center; gap: 7px; }
  .sw { width: 14px; height: 14px; border-radius: 4px; display: inline-block; }
  .ln { width: 26px; height: 0; border-top: 2px solid var(--in); display: inline-block; }
  .ln.may { border-top-style: dashed; border-color: var(--ink3); }
  .ln.call { border-top-style: dotted; border-color: var(--ink3); }

  /* a business value: what the expert may change, and it looks changeable */
  .val { display: inline-flex; align-items: center; gap: 6px; font: 600 13px/1.5 var(--mono); color: var(--ink);
         background: var(--edit); border: 1.5px solid var(--edit-line); border-radius: 7px; padding: 0 7px 0 6px;
         cursor: pointer; vertical-align: baseline; white-space: nowrap; }
  .val:hover, .val[aria-expanded="true"] { background: var(--edit-hi); }
  .val svg.i { width: 14px; height: 14px; color: var(--edit-ink); vertical-align: 0; }
  .val .n { font: 600 12px var(--sans); color: var(--edit-ink); }
  .editor { margin: 4px 0 6px; border: 1.5px solid var(--edit-line); border-radius: 10px; background: var(--edit);
            padding: 12px 14px; font: 15px/1.5 var(--sans); color: var(--ink); white-space: normal; }
  .editor .why { margin: 0 0 10px; color: var(--edit-ink); font-size: 14px; max-width: 72ch; }
  .editor .name { font: 600 12.5px var(--mono); }
  .pairs { display: grid; grid-template-columns: max-content 16px minmax(140px, 300px); gap: 6px 10px; align-items: center; }
  .pairs.single { grid-template-columns: minmax(160px, 380px); }
  .pairs .from { font: 13.5px var(--mono); }
  .pairs .arrow { color: var(--ink3); display: grid; }
  .pairs .arrow svg.i { width: 15px; height: 15px; }
  .pairs code.ro { color: var(--ink2); }
  .editor input { font: 600 13.5px var(--mono); padding: 4px 8px; border: 1px solid var(--line2); border-radius: 6px;
                  background: var(--surface); width: 100%; }
  .editor input:focus { outline: 2px solid var(--in); outline-offset: 0; }
  .editor input.changed { border-color: var(--edit-line); box-shadow: 0 0 0 1px var(--edit-line); }
  .editor input:disabled { opacity: .55; }
  .bar { display: flex; align-items: center; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
  .bar .msg { color: var(--ink2); font-size: 13.5px; }
  .editor .bar .msg { color: var(--edit-ink); }
  .result { margin-top: 12px; background: var(--surface); border: 1px solid var(--line); border-radius: 8px;
            padding: 10px 12px; font-size: 14px; }
  .result p { margin: 0; }
  .result ul { margin: 6px 0 0; padding: 0; list-style: none; }
  .result li { display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: baseline; padding: 3px 0; font-size: 13.5px; }
  .result li .time { font: 12.5px var(--mono); color: var(--ink3); }
  .result svg.sep, .path svg.sep { width: 14px; height: 14px; color: var(--ink3); vertical-align: -2px; }
  .result.flat { display: flex; gap: 10px; align-items: flex-start; }

  .section { margin-top: 32px; }
  .section > h2, .section > summary > h2 { font-size: 18px; margin: 0 0 4px; display: inline-flex; gap: 10px; align-items: center; }
  .section > p { margin: 0 0 12px; color: var(--ink2); max-width: 74ch; }
  details.section > summary { cursor: pointer; }
  details.section > p { margin: 6px 0 12px; color: var(--ink2); }
  .count { font-size: 13px; font-weight: 700; color: var(--ink2); background: var(--sunk); border-radius: 999px; padding: 0 9px; }
  .vals { display: grid; grid-template-columns: max-content max-content minmax(0, 1fr); column-gap: 22px;
          background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 4px 18px;
          box-shadow: var(--shadow); }
  .vrow { display: contents; }
  .vrow > * { padding: 10px 0; border-top: 1px solid var(--line); min-width: 0; }
  .vals > .vrow:first-child > * { border-top: 0; }
  .vrow .k { font: 600 13.5px/22px var(--mono); }
  .vrow .doc { color: var(--ink2); font-size: 14px; }
  .vals > .slot { grid-column: 1 / -1; padding-bottom: 8px; }
  textarea.code { width: 100%; min-height: 300px; font: 13px/1.6 var(--mono); border: 1px solid var(--line2);
                  border-radius: 10px; background: var(--surface); padding: 12px 14px; resize: vertical; tab-size: 4; }
  .filebox { margin-top: 10px; }
  .filebar { font-size: 13px; color: var(--ink3); margin-bottom: 6px; word-break: break-all; }

  /* ---------- lists: activity, review, setup ---------- */
  .list { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow);
          overflow: hidden; }
  .list > .it + .it { border-top: 1px solid var(--line); }
  .it.none p { margin: 0; padding: 18px; color: var(--ink2); }
  .row { display: grid; grid-template-columns: 66px 20px auto minmax(0, 1fr); gap: 4px 14px;
         align-items: center; padding: 10px 16px; width: 100%; text-align: left; background: none; border: 0;
         cursor: pointer; }
  .row:hover, .row[aria-expanded="true"] { background: var(--ground); }
  .row .time { font: 13px var(--mono); color: var(--ink3); }
  .path { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; min-width: 0; font-weight: 600; font-size: 14.5px; }
  .path .u { display: inline-flex; align-items: center; gap: 5px; }
  .path .stage { display: inline-flex; align-items: center; flex-wrap: wrap; }
  .path .stage .and { margin-right: 7px; color: var(--ink3); }
  .path .u svg.i { width: 15px; height: 15px; color: var(--ink3); }
  .path .tries { font-size: 12.5px; font-weight: 600; color: var(--err); }
  .path .tries.through { color: var(--ink2); }
  .carried { font: 13px var(--mono); color: var(--ink2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row .err-t { grid-column: 3 / -1; color: var(--err); font-size: 13.5px; }
  .tools { display: flex; gap: 12px 20px; align-items: end; flex-wrap: wrap; margin-bottom: 16px; }
  .find { display: flex; gap: 8px; align-items: end; flex-wrap: wrap; }
  .find label, .flowsel { display: flex; flex-direction: column; gap: 4px; font-size: 13.5px; font-weight: 600; color: var(--ink2); }
  .find input, .flowsel select, .token input, .gen textarea, .sec-row input {
    font: 14px var(--sans); padding: 7px 10px; border: 1px solid var(--line2); border-radius: 8px;
    background: var(--surface); color: var(--ink); }
  .find input { width: 340px; max-width: 70vw; }
  .find input, .flowsel select, .find .btn { height: 38px; }
  .found { margin-bottom: 22px; }
  .found-head { display: flex; align-items: center; gap: 12px; margin-bottom: 8px; }
  .found-head h2 { font-size: 16px; margin: 0; }
  .found-head p { margin: 0; color: var(--ink2); }
  .newer { margin: 0 0 10px; padding: 8px 14px; border-radius: 10px; background: var(--in-wash); color: var(--ink);
           display: flex; align-items: center; gap: 12px; font-size: 14px; }

  .trace { padding: 6px 16px 14px; background: var(--ground); border-top: 1px dashed var(--line2); }
  .trace > p { margin: 8px 0; }
  .hop { display: grid; grid-template-columns: 74px minmax(0, 1fr) auto; gap: 2px 12px; padding: 9px 0;
         border-bottom: 1px solid var(--line); }
  .hop:last-child { border-bottom: 0; }
  .hop .at, .hop .took { font: 12.5px var(--mono); color: var(--ink3); padding-top: 2px; }
  .hop .took { text-align: right; }
  .hop .who { display: flex; align-items: center; gap: 6px 8px; flex-wrap: wrap; padding-left: calc(var(--d, 0) * 20px); }
  .hop .who b { font-weight: 600; }
  .hop .kind { font-size: 12.5px; color: var(--ink3); }
  .hop .what, .hop .extra { grid-column: 2 / -1; padding-left: calc(var(--d, 0) * 20px); }
  .hop .what { font-size: 14px; color: var(--ink2); display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  .hop .extra { display: flex; gap: 4px 18px; flex-wrap: wrap; align-items: flex-start; }
  .hop .extra details { min-width: 0; max-width: 100%; }
  .steps { margin: 6px 0 0; padding: 8px 10px; border-radius: 8px; background: var(--surface); border: 1px solid var(--line);

<script>
'use strict';
/* The Vejas panel: one file, no dependency, served by the runtime. Every view
   is derived from the runtime's API, itself derived from the code (ADR-0019):
   the panel draws what the code says and changes a flow only through its
   business literals, checked on real events before they go live (ADR-0005). */

const $ = (s, el = document) => el.querySelector(s);

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]));
const enc = encodeURIComponent;
const uniq = a => [...new Set(a)];
const icon = (n, cls = '') => `<svg class="i ${cls}" aria-hidden="true"><use href="#i-${n}"/></svg>`;
const plural = (n, one, many = one + 's') => `${n} ${n === 1 ? one : many}`;
const show = v => typeof v === 'string' ? v : JSON.stringify(v);
const trunc = (v, n = 40) => { const s = v === undefined ? '' : (show(v) ?? ''); return s.length > n ? s.slice(0, n - 1) + '…' : s; };
const clock = ts => new Date((ts || 0) * 1000).toLocaleTimeString([], {hour: '2-digit', minute: '2-digit', second: '2-digit', hourCycle: 'h23'});
const shortName = n => String(n ?? '').split(':').pop();
const unitName = u => String(u ?? '').replace(/^(flow|connector):/, '');
const baseName = p => String(p ?? '').split('/').pop();
const pretty = s => { try { return JSON.stringify(typeof s === 'string' ? JSON.parse(s) : s, null, 2); } catch { return String(s); } };
const getPath = (obj, path) => String(path).split('.').reduce((o, k) => (o != null && typeof o === 'object' ? o[k] : undefined), obj);
const orList = (items, word = 'or') => items.length <= 1 ? items.join('') : items.slice(0, -1).join(', ') + ` ${word} ` + items[items.length - 1];
const smooth = () => matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth';
const hrefFlow = n => '#/flow/' + enc(n);
const hrefCon = n => '#/connector/' + enc(n);
const hrefSvc = n => '#/service/' + enc(n);

async function getJSON(url) {
  const r = await fetch(url);
  if (!r.ok) throw new Error((await r.text()) || r.statusText);
  return r.json();
}
let toastTimer = 0;
function toast(msg, err) {
  const t = $('#toast');
  t.textContent = msg; t.className = err ? 'show err' : 'show';
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { t.className = err ? 'err' : ''; }, err ? 6000 : 3200);
}
const fail = e => toast(String(e && e.message || e).slice(0, 220), true);

// With VEJAS_TOKEN set every write wants it. The panel asks once and keeps it in
// this page's memory, never in storage: a reload asks again.
let writeToken = '';
const send = (url, payload, headers = {}) => fetch(url, { method: 'POST',
  headers: {'Content-Type': 'application/json',
    ...(writeToken ? {Authorization: `Bearer ${writeToken}`} : {}), ...headers},
  body: JSON.stringify(payload) });
async function post(url, payload) {
  let res = await send(url, payload);
  if (res.status === 401 && !writeToken) {
    writeToken = (prompt('Write token (VEJAS_TOKEN)') || '').trim();
    if (writeToken) res = await send(url, payload);
  }
  if (!res.ok) throw new Error(await res.text());
  return res;
}
const setLiteral = (file, name, key, value) => post('/surface/set', {file, name, key, value});

// A literal whose KEY names a credential is never shown in the clear (ADR-0008
// spirit): the panel renders it masked, editing stays write-only. The pattern is
// injected at serve time from secrets::SECRET_KEY_PATTERN, one definition, so
// the mask and the admission lint (ADR-0017) can never drift apart. A key is
// read as secrets::key_as_read reads it, camelCase as snake_case (accessToken
// as access_Token): an underscore where a lowercase letter or a digit meets an
// uppercase one.
const SECRET_KEY_PATTERN = "{{SECRET_PATTERN}}";
const keyAsRead = k => String(k).replace(/([a-z0-9])(?=[A-Z])/g, '$1_');
const isSecretKey = k => new RegExp(SECRET_KEY_PATTERN, 'i').test(keyAsRead(k));
// A path to a value, `auth.pass` or a literal's key `auth/pass`: a credential
// when any part of it names one, as maskDeep hides all that is under such a key.
const secretPath = p => String(p).split(/[./]/).some(isSecretKey);
// A pair names its credential in a value, {"name": "Authorization", "value":
// "Bearer …"}: a header list, an environment, tags. Its value is masked too, as
// the trace record masks it (ADR-0017). Only a name shaped like a key counts.
const PAIR_NAMES = ['name', 'key', 'header', 'field', 'parameterkey', 'parametername'];
const PAIR_VALUES = ['value', 'parametervalue'];
const namesCredential = x => typeof x === 'string' && x.length <= 128 && !/\s/.test(x) && isSecretKey(x);
const pairNamed = o => !!o && typeof o === 'object' && !Array.isArray(o)
  && Object.entries(o).some(([k, x]) => PAIR_NAMES.includes(k.toLowerCase()) && namesCredential(x));
const pairValue = (o, k) => PAIR_VALUES.includes(String(k).toLowerCase()) && pairNamed(o);
// A value as the panel may show it: every credential masked, at any depth.
function maskDeep(v) {
  if (Array.isArray(v)) return v.map(maskDeep);
  if (!v || typeof v !== 'object') return v;
  const named = pairNamed(v);
  return Object.fromEntries(Object.entries(v).map(([k, x]) => [k,
    isSecretKey(k) || (named && x !== null && PAIR_VALUES.includes(k.toLowerCase())) ? 'hidden' : maskDeep(x)]));
}
// Would maskDeep hide what is at this path of a value: a credential-named key
// on the way to it, or the value of a pair that names one.
function hiddenAt(root, path) {
  let o = root;
  for (const k of String(path).split('.')) {
    if (isSecretKey(k)) return true;
    if (!o || typeof o !== 'object') return false;
    if (pairValue(o, k)) return true;
    o = o[k];

const masked = v => maskDeep(parsed(v));

// had focused gets the focus back, the <details> they had opened stay open.
const placeOf = el => [el.tagName, el.dataset.act, el.dataset.path, el.dataset.seq, el.dataset.id, el.dataset.do, el.dataset.key,
  el.getAttribute('href'), el.closest('[data-key]')?.dataset.key, el.closest('[data-id]')?.dataset.id].join('|');
function holdPlace(region) {
  const a = document.activeElement;
  const focused = a && a !== document.body && region.contains(a) ? placeOf(a) : null;
  const open = new Set($$('details[open]', region).map(placeOf));
  return () => {
    for (const d of $$('details', region)) if (open.has(placeOf(d))) d.open = true;
    if (!focused) return;
    // only a control that is surely the same one: Enter on another could replay or discard
    const same = $$('a[href], button, input, select, textarea, summary, [tabindex]', region).filter(x => placeOf(x) === focused);
    if (same.length === 1) same[0].focus({preventScroll: true});

// A region the polls refresh is written only when what it shows changed.
const written = new WeakMap();
function rewrite(region, html) {
  if (!region || written.get(region) === html) return;
  const restore = holdPlace(region);
  region.innerHTML = html;
  written.set(region, html);
  restore();
}

/* ---------- what the runtime holds ---------- */
const S = { surface: [], topo: {flows: [], connectors: []}, graph: {flows: [], services: [], connectors: []},
            events: [], dlq: [], proposals: [], secrets: null };
let PAGE = null;  // the literals of the flow, service or connector on screen

async function loadCore() {
  const [surface, topo, graph, secrets] = await Promise.all([
    getJSON('/surface'),
    getJSON('/topology').catch(() => ({flows: [], connectors: []})),
    getJSON('/graph').catch(() => ({flows: [], services: [], connectors: []})),
    getJSON('/secrets').catch(() => null),
  ]);
  Object.assign(S, {surface, topo, graph, secrets});
  renderRail();
}

function unitStatus(file) {
  return [...(S.topo.flows || []), ...(S.topo.connectors || [])].find(t => t.file === file) || null;
}
function stateOf(file) {
  const st = unitStatus(file);
  if (!st) return {cls: 'off', label: 'Not running'};
  const s = String(st.status || '');
  // a running unit keeps the last error it met since it started (a message it failed on)
  if (s.startsWith('running')) return {cls: 'ok', label: 'Running', since: st.last_error};
  return {cls: st.last_error ? 'bad' : 'off', label: s ? s[0].toUpperCase() + s.slice(1) : 'Not running', error: st.last_error};
}
const stateHtml = st => `<span class="state ${st.cls}"><span class="dot"></span>${esc(st.label)}</span>`;
const callout = msg => `<div class="callout">${icon('alert')}<p>${esc(msg)}</p></div>`;

// NATS subject patterns: `*` is one token, `>` the rest.
function matches(pattern, subject) {
  const p = String(pattern).split('.'), s = String(subject).split('.');
  for (let i = 0; i < p.length; i++) {
    if (p[i] === '>') return s.length > i;
    if (i >= s.length || (p[i] !== '*' && p[i] !== s[i])) return false;
  }
  return p.length === s.length;
}
// Two patterns overlap when some subject matches both (`vx.a.*` and `vx.*.b`).
function overlaps(a, b) {
  const x = String(a).split('.'), y = String(b).split('.');
  for (let i = 0; i < Math.max(x.length, y.length); i++) {
    if (x[i] === '>') return y.length > i;
    if (y[i] === '>') return x.length > i;
    if (i >= x.length || i >= y.length) return false;
    if (x[i] !== '*' && y[i] !== '*' && x[i] !== y[i]) return false;
  }
  return true;
}
// Whether every subject `inner` matches also matches `outer`: then an event
// sent on `inner` always reaches what listens on `outer`.
function covers(outer, inner) {
  const o = String(outer).split('.'), n = String(inner).split('.');
  for (let i = 0; i < o.length; i++) {

      const end = fstringEnd(s, i + 1);
      out += '<span class="str">f</span>' + fstringHtml(s.slice(i + 1, end), ctx, lits);
      i = end; chain = false; continue;
    }
    if (c === '"') { const end = stringEnd(s, i); out += `<span class="str">${esc(s.slice(i, end))}</span>`; i = end; chain = false; continue; }
    if (c === '#') { let end = s.indexOf('\n', i); if (end < 0) end = s.length; out += `<span class="cmt">${esc(s.slice(i, end))}</span>`; i = end; continue; }
    const m = /^[A-Za-z_]\w*/.exec(s.slice(i));
    if (m && !/\w/.test(prev)) {
      const w = m[0];
      if (prev !== '.' && literals.has(w)) { out += chip(ctx, w); chain = false; }
      else if ((prev !== '.' && ctx.fields.has(w)) || (prev === '.' && chain)) { out += `<span class="ref">${esc(w)}</span>`; chain = true; }

      i += w.length; continue;

function flowLede(f) {

  // one event retried five times is one event: it failed if its last attempt did
  const byEvent = messagesOf(evs);

const vrow = (ctx, e) => `<div class="vrow" data-slot><span class="k">${esc(e.name)}</span><span>${chip(ctx, e.name, true)}</span><span class="doc">${esc(e.doc || '')}</span></div>`;

/* ---------- the literal editor: one change at a time, checked on real events ---------- */
// Apply = shadow-replay first (ADR-0005): the runtime reruns the last real events

function buildEditor(ctx, e) {
  const box = document.createElement('div');

  const fields = [];
  const grid = document.createElement('div');
  const v = e.value, secret = isSecretKey(e.name);
  // `veiled`: the value of a pair that names a credential, {name: "Authorization", value: …}

    const text = mode === 'list' ? original.map(show).join(', ') : mode === 'rule' ? ruleToText(original) : show(original);

      } else if (e.kind === 'mapping') {

// What the flow makes of one event, with the current value or with the new one.

// answers 409 or 401 and the approval token goes with the retry. Outside it the
// same prompt takes the write token, so the one value is sent as both.
async function dlqAction(path, body) {
  try {
    let tok = approvalToken;
    let res = await send(path, body, tok ? {'X-Approval-Token': tok} : {});
    if ((res.status === 409 || res.status === 401) && !tok) {
      tok = (prompt('Approval token in governed mode, otherwise the write token') || '').trim();
      if (!tok) return;
      res = await send(path, body, {'X-Approval-Token': tok, Authorization: `Bearer ${tok}`});
      if (res.ok) approvalToken = tok;
    }
    if (!res.ok) throw new Error(await res.text());
    // a replay answers 200 with what it could not do: a letter that stayed says why
    const r = path.endsWith('replay') ? await res.json().catch(() => ({})) : {};
    const errs = r.errors || [];
    if (errs.length) toast((r.replayed ? `Replayed ${r.replayed}. ` : 'Not replayed. ') + errs[0], true);
    else toast(path.endsWith('replay') ? 'Replayed.' : 'Discarded.');

  } catch (e) { fail(e); }
}

    if (!res.ok) throw new Error(await res.text());

  if (!input.value) return toast('Paste a value first.', true);
  btn.disabled = true;
  try {
    const res = await (await post('/secrets/set', {ref: input.dataset.ref, value: input.value})).json();
    input.value = '';
    toast(`Secret set. Restarted: ${(res.restarted || []).join(', ') || 'nothing'}.`);
    await loadCore();
    await render({keepScroll: true});
  } catch (e) { fail(e); btn.disabled = false; }
}

/* ---------- a new flow or connector, written by the agent ---------- */
async function pageNew(view, r) {
  const type = r.q.get('type') === 'connector' ? 'connector' : 'flow';
  document.title = `New ${type} · Vejas`;
  view.innerHTML = `<div class="head"><h1>New ${type}</h1></div>
    <p class="lede">${type === 'flow'
      ? 'Describe what it should do, with which events. An agent writes it in VejasScript, one screen of readable code, and it starts running. You then read it here and correct its values.'
      : 'Describe the system to connect, and what to take from it or send to it. An agent writes the connector with one of the drivers below, and it starts running.'}</p>
    <div class="seg" role="radiogroup" aria-label="What to create"><a href="#/new" role="radio" aria-checked="${type === 'flow'}">Flow</a><a href="#/new?type=connector" role="radio" aria-checked="${type === 'connector'}">Connector</a></div>
    <form class="gen" id="gen-form"><label for="prompt">What should it do?</label>
      <textarea id="prompt" placeholder="${type === 'flow' ? 'Example: when a shop order arrives, send it to the ERP with the country as an ISO code.' : 'Example: every five minutes, fetch the new contacts from the CRM API.'}"></textarea>
      <div class="bar"><button class="btn primary" type="submit">${icon('plus')}Write it</button><span class="msg" id="gen-msg"></span></div></form>
    <section class="section"><h2>Drivers in this runtime</h2><p>A connector uses one driver, the protocol it speaks.</p><div id="drivers" class="muted">Loading…</div></section>`;
  loadDrivers($('#drivers', view));
  $('#gen-form', view).addEventListener('submit', async ev => {
    ev.preventDefault();
    const prompt = $('#prompt').value.trim();
    if (!prompt) return toast('Describe it first.', true);
    const btn = $('#gen-form button'), msg = $('#gen-msg');
    btn.disabled = true; msg.textContent = 'The agent is writing it. This can take a minute.';
    try {
      const body = await (await post(type === 'connector' ? '/connectors/new' : '/flows/new', {prompt})).json();
      toast(`${type === 'connector' ? 'Connector ' + body.connector : 'Flow ' + body.flow} created and running.`);
      await loadCore();
      location.hash = type === 'connector' ? hrefCon(body.connector) : hrefFlow(body.flow);
    } catch (e) { fail(e); btn.disabled = false; msg.textContent = ''; }
  });
}

const PAGES = {map: pageMap, flow: pageFlow, service: pageService, services: pageServices, connector: pageConnector,
               connectors: pageConnectors, activity: pageActivity, review: pageReview, secrets: pageSecrets, new: pageNew};

/* ---------- one listener for every action ---------- */
const ACTIONS = {
  'open-code': () => openCode(),
  'edit-sample': () => toggleSample(),
  'trace': b => toggleTrace(b),
  'show-newer': () => activityRefresh(true),
  'clear-found': () => { const f = $('#found'); f.hidden = true; f.innerHTML = ''; $('#find-q').value = ''; },
  'golden': b => saveGolden(b),
  'dlq': b => {
    const seq = b.dataset.seq, purge = b.dataset.path.endsWith('purge');
    if (purge && !confirm(seq ? 'Discard this event for good?' : 'Discard every dead letter for good?')) return;
    dlqAction(b.dataset.path, seq ? {seq: Number(seq)} : {});
  },
  'decide': b => decideProposal(b.dataset.id, b.dataset.do),
  'secret-set': b => setSecretRow(b),
  'test-con': b => testConnector(b),
  'map-clear': () => MAP && MAP.clear(),
  'open-tech': () => { const t = $('#tech'); if (t) { t.open = true; t.scrollIntoView({behavior: smooth(), block: 'start'}); } },
};
document.addEventListener('click', ev => {
  const val = ev.target.closest('.val');
  if (val) { ev.preventDefault(); toggleEditor(val); return; }
  const b = ev.target.closest('[data-act]');
  if (b && ACTIONS[b.dataset.act]) { ev.preventDefault(); ACTIONS[b.dataset.act](b); }
});

/* ---------- live data ---------- */
// What the page reads from the events ring. Activity reads the newest of all,
// and for one flow, that flow's events with the other hops of each; a flow's or
// a connector's page reads that unit's own. A timer that sends every second
// never pushes a quiet flow's events out of its own page.
function eventsUrl(r = R) {
  if (r.page === 'activity') { const one = r.q.get('flow'); return one ? '/events?paths=1&flow=' + enc('flow:' + one) : '/events'; }
  if (r.page === 'flow' || r.page === 'connector') return '/events?flow=' + enc(r.page + ':' + r.arg);
  return null;
}
async function loadEvents(r = R) {
  const url = eventsUrl(r);
  if (!url) return false;
  let events;
  try { events = (await getJSON(url)).events || []; } catch { return false; }
  if (url !== eventsUrl()) return false;  // the page changed meanwhile
  S.events = events;
  return true;
}
// The poll refreshes the page on screen, and only while no other is loading:
// R runs ahead of the screen as soon as a link is followed.
async function pollEvents() {
  const r = SHOWN;
  if (!r || r !== R || (r.page !== 'activity' && r.page !== 'flow')) return;
  if (!await loadEvents(r) || SHOWN !== r) return;
  if (r.page === 'activity') activityRefresh();
  else {
    const el = $('#flow-lede'), f = (S.graph.flows || []).find(x => x.name === r.arg);
    if (el && f) rewrite(el, flowLede(f));
  }
}
async function pollReview() {
  try {
    const [d, p] = await Promise.all([getJSON('/dlq'), getJSON('/proposals')]);
    S.dlq = d.dead_letters || []; S.proposals = p.proposals || [];
  } catch { return; }
  renderReviewCount();
  if (SHOWN && SHOWN.page === 'review') reviewRefresh();
}
// A live promote superseded by a git deploy (ADR-0021).
async function pollEvictions() {
  try {
    const evs = (await getJSON('/evictions')).evictions || [];
    const el = $('#banner');
    if (!evs.length) { el.hidden = true; return; }
    const flows = uniq(evs.map(e => e.flow));
    el.innerHTML = `${icon('alert')}<p><b>A change made live here was replaced by a deploy.</b> ${flows.map(f => `<code>${esc(f)}</code>`).join(', ')} now ${flows.length > 1 ? 'run' : 'runs'} the version from git. The replaced change is kept in the version history (VEJAS_VERSIONS) and can be made live again on the new version.</p>`;
    el.hidden = false;
  } catch {}
}
async function pollTopo() {
  try { S.topo = await getJSON('/topology'); renderRail(); } catch {}
}

(async function start() {
  try { await Promise.all([loadCore(), pollReview()]); }
  catch (e) {
    $('#page').innerHTML = `<div class="head"><h1>The runtime does not answer</h1></div><p class="lede">${esc(e.message)}</p>`;
    return;
  }
  await render();
  pollEvictions();
  setInterval(pollEvents, 4000);
  setInterval(pollReview, 5000);
  setInterval(pollEvictions, 5000);
  setInterval(pollTopo, 10000);
})();
</script>
