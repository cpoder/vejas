[package]
name = "vejas-runtime"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Vejas runtime: supervises agent-written integration flows and bus connectors. No builder UI."

[dependencies]
tiny_http = "0.12"
serde_json = "1"
ctrlc = "3.4"
nats = "0.25"

[[bin]]
name = "vejas-runtime"
path = "src/main.rs"

[profile.release]
strip = true
lto = true
