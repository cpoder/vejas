[package]
name = "vejas-runtime"
version = "0.7.0"
edition = "2021"
license = "Apache-2.0"
description = "Vejas runtime: supervises agent-written integration flows and bus connectors. No builder UI."

[dependencies]
tiny_http = "0.12"
serde_json = "1"
# `termination` so SIGTERM/SIGHUP (a k8s rolling restart) hit the graceful drain
# path, not default immediate kill — needed for lease handoff (ADR-0020).
ctrlc = { version = "3.4", features = ["termination"] }
# The connector contract (ADR-0038): the bus, the trace context, the Driver
# trait and the services drivers share. The NATS client and tokio come with it
# and stay inside its bus module (ADR-0035): the runtime sees neither.
vejas-connector = { path = "../sdk" }
# Pooled, blocking HTTP(S) client for the http-out/http-poll/oauth-poll drivers
# (replaces one curl process per request). Pure-Rust TLS (rustls), self-contained.
ureq = "2"
# already in the tree through ureq: parses a URL to name its host and its parts
url = "2"
# Already in the tree via ureq (rustls 0.23 + webpki-roots 0.26) — made direct so
# the hand-rolled MQTT client can wrap its stream in TLS. No new binary weight.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
webpki-roots = "0.26"
# The trace record's scrub (ADR-0034): the credential mask, compiled from the
# one pattern the panel and the admission lint use; the values the secret
# stores handed out, found in one pass however many there are; and JSON read
# and written again without a tree in between. All three were in the tree
# already (regex and aho-corasick through async-nats and varpulis, serde under
# serde_json), so no new binary weight.
regex = "1"
aho-corasick = "1"
serde = "1"
# Signed webhooks on http-in (ADR-0037): HMAC-SHA256 and its constant-time
# check, and the base64 some senders sign in. Both were in the tree already
# (ring under rustls and async-nats, base64 under async-nats), so no new
# binary weight.
ring = "0.17"
base64 = "0.22"
# The Varpulis CEP engine, embedded as a library (ADR-0031): compile a VPL
# program, feed it events, publish its emits. No async runtime in its tree —
# its own CI (scripts/check-engine-deps.py) fails if one ever appears.
varpulis-engine = { git = "https://github.com/varpulis/varpulis", rev = "1cb201b6b11b2808eaf03dfebf1027997dd52f5a" }

[[bin]]
name = "vejas-runtime"
path = "src/main.rs"

[profile.release]
strip = true
lto = true

# tiny_http 0.12.0, the last release, patched in the repo: its body drain
# allocated the whole declared Content-Length at once and it read with no
# timeout and no bound. See third_party/tiny_http/README.md.
[patch.crates-io]
tiny_http = { path = "../third_party/tiny_http" }
