[package]
name = "vejas-runtime"
version = "0.5.1"
edition = "2021"
license = "Apache-2.0"
description = "Vejas runtime: supervises agent-written integration flows and bus connectors. No builder UI."

[dependencies]
tiny_http = "0.12"
serde_json = "1"
# `termination` so SIGTERM/SIGHUP (a k8s rolling restart) hit the graceful drain
# path, not default immediate kill — needed for lease handoff (ADR-0020).
ctrlc = { version = "3.4", features = ["termination"] }
# The NATS client and what it runs on. All four stay inside src/bus.rs (ADR-0035):
# the rest of the runtime is synchronous and sees neither tokio nor a NATS type.
async-nats = { version = "0.52", default-features = false, features = ["jetstream", "kv", "object-store", "ring", "server_2_10"] }
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "time"] }
bytes = "1"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
# Pooled, blocking HTTP(S) client for the http-out/http-poll/oauth-poll drivers
# (replaces one curl process per request). Pure-Rust TLS (rustls), self-contained.
ureq = "2"
# Already in the tree via ureq (rustls 0.23 + webpki-roots 0.26) — made direct so
# the hand-rolled MQTT client can wrap its stream in TLS. No new binary weight.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
webpki-roots = "0.26"
# The Varpulis CEP engine, embedded as a library (ADR-0031): compile a VPL
# program, feed it events, publish its emits. No async runtime in its tree —
# its own CI (scripts/check-engine-deps.py) fails if one ever appears.
varpulis-engine = { git = "https://github.com/varpulis/varpulis", rev = "1cb201b6b11b2808eaf03dfebf1027997dd52f5a" }

[[bin]]
name = "vejas-runtime"
path = "src/main.rs"

[profile.release]
strip = true
lto = true
