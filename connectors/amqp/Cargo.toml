[package]
name = "vejas-amqp"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Vejas AMQP 0-9-1 (RabbitMQ) connector spike: sync pure-Rust via amiquip, own NATS client."

[dependencies]
amiquip = { version = "0.4", default-features = false }
crossbeam-channel = "0.5"
# The bus: this crate compiles the runtime's core/src/bus.rs (ADR-0035).
async-nats = { version = "0.52", default-features = false, features = ["jetstream", "kv", "object-store", "ring", "server_2_10"] }
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "time"] }
bytes = "1"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
serde_json = "1"
# Pure-Rust TLS for amqps:// — rustls (already in the tree via async-nats, ring
# provider; no openssl-sys) wrapped over amiquip's mio-0.6 stream via a small Evented
# adapter (ADR-0026 Q1). This is the whole point of NOT using amiquip's native-tls
# default.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-pemfile = "2"
webpki-roots = "0.26"
mio = "0.6"

[[bin]]
name = "vejas-amqp"
path = "src/main.rs"

[profile.release]
strip = true
lto = true
