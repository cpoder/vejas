[package]
name = "vejas-amqp"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Vejas AMQP 0-9-1 (RabbitMQ) connector spike: sync pure-Rust via amiquip, own NATS client."

[dependencies]
amiquip = { version = "0.4", default-features = false }
crossbeam-channel = "0.5"
nats = "0.25"
serde_json = "1"

[[bin]]
name = "vejas-amqp"
path = "src/main.rs"

[profile.release]
strip = true
lto = true
