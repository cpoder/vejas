name: ci

on:
  push:
    branches: [master]
  pull_request:

jobs:
  # The connector crate (ADR-0038) and the standalone connectors built on it:
  # a change to the crate must leave each of them building and green.
  connector-crate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: The crate's unit tests
        run: cargo test --manifest-path sdk/Cargo.toml

      - name: IBM MQ on the crate
        run: cargo test --manifest-path connectors/mq/Cargo.toml

      - name: AMQP on the crate
        run: cargo test --manifest-path connectors/amqp/Cargo.toml

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Language unit tests
        run: cargo test --manifest-path core/Cargo.toml

      - name: Build the runtime
        run: cargo build --release --manifest-path core/Cargo.toml

      - name: Golden end-to-end cases
        run: core/target/release/vejas-runtime vjs-test tests/vjs

      # Every script in the repo — bundled flows/services/connectors AND every
      # example (.vjs and .vjs.example, nested dirs included) — must parse.
      # Examples are contract, not dead documentation.
      - name: Parse-check every script and example
        run: |
          fail=0
          while IFS= read -r f; do
            out=$(core/target/release/vejas-runtime vjs-check "$f" 2>&1) || true
            if [ "$out" != "ok" ]; then
              echo "FAIL $f: $out"
              fail=1
            fi
          done < <(find flows services connectors packages docs/examples bench \
                     \( -name '*.vjs' -o -name '*.vjs.example' \) \
                     -not -path '*/target/*')
          # Detect units are VPL, checked by the embedded engine (ADR-0031).
          while IFS= read -r f; do
            out=$(core/target/release/vejas-runtime vpl-check "$f" 2>&1) || true
            if [ "$out" != "ok" ]; then
              echo "FAIL $f: $out"
              fail=1
            fi
          done < <(find detects packages docs/examples e2e \
                     \( -name '*.vpl' -o -name '*.vpl.example' \) \
                     -not -path '*/target/*' 2>/dev/null)
          exit $fail

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Docker image builds
        run: docker build -t vejas:ci .

  admission:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the runtime
        run: cargo build --release --manifest-path core/Cargo.toml
      - name: Install NATS (server + CLI)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download -R nats-io/nats-server -p '*linux-amd64.tar.gz' -O ns.tgz
          tar xzf ns.tgz && sudo mv nats-server-*/nats-server /usr/local/bin/
          gh release download -R nats-io/natscli -p '*linux-amd64.zip' -O nc.zip
          unzip -q nc.zip && sudo mv nats-*-linux-amd64/nats /usr/local/bin/
      - name: Credential-pattern profile (ADR-0017 decision pin)
        run: e2e/admission/pattern-bench.py
      - name: Build the AMQP connector (real-broker certification needs the binary)
        run: cargo build --release --manifest-path connectors/amqp/Cargo.toml
      - name: Connector admission (ADR-0017)
        run: e2e/admission/run.sh
      - name: Transport invariants (ROADMAP Phase 4)
        run: e2e/transport/run.sh
      - name: Detect-unit invariants (ADR-0031, embedded engine)
        run: e2e/detect/run.sh
      - name: Detect demo — signature vs behaviour, across a kill -9
        run: e2e/detect-demo/run.sh
      - name: Offset-resume invariant (ADR-0022, kill -9 mid-stream)
        run: e2e/offset-resume.sh
      - name: Documented contracts hold (ADR-0029 R7 — doc examples vs master)
        run: e2e/doc-examples.sh
      - name: Path traversal contained (ADR-0029 R7 — F1 regression)
        run: e2e/security-traversal.sh
      - name: Write gate holds across verbs (ADR-0029 R7 — Finding A regression)
        run: e2e/api-write-gate.sh
      - name: Governed mode gates every write (ADR-0024/R7 — Finding B regression)
        run: e2e/governed-gate.sh
      - name: Secrets stay write-only in shadow runs (ADR-0008, S4)
        run: e2e/governed-agent.sh
      - name: An emit subject cannot carry protocol
        run: e2e/emit-subject.sh
      - name: http-in survives a burst and a thread limit
        run: e2e/http-in-bound.sh
      - name: Signed webhooks on http-in refuse what their sender did not sign (ADR-0037)
        run: e2e/http-in-signed.sh
      - name: Dead letters announce themselves, without feeding themselves
        run: e2e/dlq-events.sh
      - name: The trace record keeps each hop, masked (ADR-0034 lot B)
        run: e2e/trace-record.sh
      - name: An event the bus did not confirm is never answered as taken
        run: e2e/bus-down.sh
      - name: Docs book builds (broken includes fail here, not on deploy)
        run: |
          curl -sL https://github.com/rust-lang/mdBook/releases/download/v0.5.4/mdbook-v0.5.4-x86_64-unknown-linux-gnu.tar.gz | tar xz
          ./mdbook build docs/book
