name: ci

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Language unit tests
        run: cargo test --manifest-path core/Cargo.toml

      - name: Build the runtime
        run: cargo build --release --manifest-path core/Cargo.toml

      - name: Golden end-to-end cases
        run: core/target/release/vejas-runtime vjs-test tests/vjs

      # Every script in the repo — bundled flows/services/connectors AND every
      # example (.vjs and .vjs.example, nested dirs included) — must parse.
      # Examples are contract, not dead documentation.
      - name: Parse-check every script and example
        run: |
          fail=0
          while IFS= read -r f; do
            out=$(core/target/release/vejas-runtime vjs-check "$f" 2>&1) || true
            if [ "$out" != "ok" ]; then
              echo "FAIL $f: $out"
              fail=1
            fi
          done < <(find flows services connectors packages docs/examples bench \
                     \( -name '*.vjs' -o -name '*.vjs.example' \) \
                     -not -path '*/target/*')
          exit $fail

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Docker image builds
        run: docker build -t vejas:ci .

  admission:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the runtime
        run: cargo build --release --manifest-path core/Cargo.toml
      - name: Install NATS (server + CLI)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download -R nats-io/nats-server -p '*linux-amd64.tar.gz' -O ns.tgz
          tar xzf ns.tgz && sudo mv nats-server-*/nats-server /usr/local/bin/
          gh release download -R nats-io/natscli -p '*linux-amd64.zip' -O nc.zip
          unzip -q nc.zip && sudo mv nats-*-linux-amd64/nats /usr/local/bin/
      - name: Credential-pattern profile (ADR-0017 decision pin)
        run: e2e/admission/pattern-bench.py
      - name: Build the AMQP connector (real-broker certification needs the binary)
        run: cargo build --release --manifest-path connectors/amqp/Cargo.toml
      - name: Connector admission (ADR-0017)
        run: e2e/admission/run.sh
      - name: Transport invariants (ROADMAP Phase 4)
        run: e2e/transport/run.sh
      - name: Offset-resume invariant (ADR-0022, kill -9 mid-stream)
        run: e2e/offset-resume.sh
      - name: Docs book builds (broken includes fail here, not on deploy)
        run: |
          curl -sL https://github.com/rust-lang/mdBook/releases/download/v0.5.4/mdbook-v0.5.4-x86_64-unknown-linux-gnu.tar.gz | tar xz
          ./mdbook build docs/book
